# config/self-learning.conf
# Shell-sourceable configuration. Lines are VAR=value only (no logic).
# Installed to: $SL_HOME/self-learning.conf
# Environment variables set before sourcing ALWAYS override these values.

SL_COACH_RULES_ENABLED=false
SL_COACH_EXPORT_ENABLED=false
SL_MEMORY_REVIEW_INTERVAL=10
SL_SKILL_REVIEW_INTERVAL=10
SL_REVIEW_MIN_TURNS=5
SL_REVIEW_MAX_TURNS=16

# Size (BYTES) at which MEMORY.md is reported as worth consolidating when it is
# injected at session start. This is an ADVISORY ONLY -- memory is never
# truncated, and exceeding it costs a named line in persist-failures.log, not
# lost content.
#
# Set generously. Hermes uses 2200 for the same idea, but as a WRITE-side budget
# that refuses the write, so its file never exceeds it; ours is read-side over a
# file allowed to grow to 1 MiB. A real store measured 22112 bytes, so a 2200
# threshold fired every session and would bury real failures in the log
# doctor.sh surfaces.
#
# Injected content is not free: roughly 4 bytes per token, so 32768 is about 8K
# tokens added at every session start AND after every compaction. Lower it if
# that cost matters more than the reminder; raise it if you would rather not be
# told.
SL_MEMORY_INJECT_BUDGET=32768
SL_COPILOT_REVIEW_MODEL=
SL_SKILLOPT_ENABLED=false
# Path to a microsoft/SkillOpt checkout. Optional when the `skillopt-sleep` CLI is on
# PATH (pip install skillopt); a checkout wins when both are present, matching upstream.
SL_SKILLOPT_REPO=
# The `run` verb is the token-expensive one and refuses until this is true.
SL_SKILLOPT_RUN_CONFIRMED=false
