# <store>/self-learning.yaml  (<store> resolved by scripts/lib/paths.py)
# Self-Learning System Configuration
# Adapted from NousResearch Hermes Agent architecture.
# All values shown are defaults -- omit to use default.
#
# Every key in this file MUST have a consumer under scripts/. Aspirational knobs
# live in plan docs, not here: a documented parameter nothing reads is worse than
# an undocumented one, because it reads as a setting you can change. Verify with
#   grep -rn "<key>" scripts/ | grep -v __pycache__
# 2026-07-31: the phantom half of this file was deleted after that grep returned
# zero for every key removed.

version: "1.0"

# Master switch
enabled: true

# Background Review
review:
  enabled: true
  interval: 10                     # Turns between mid-session reviews
  max_iterations: 16               # Max tool uses per review subagent
  quiet: true                      # Suppress review output from user view
  on_stop: true                    # Run final review on session end
  min_turns_for_stop: 5            # Minimum turns before Stop hook review fires
  cooldown_secs: 60                # Minimum seconds between review cycles
  log_dir: "<store>/logs/reviews"

# Memory System
#
# There is deliberately NO character cap here. memory_char_limit/user_char_limit
# existed in this file until 2026-07-31 and contradicted the shipped design:
# memory is never truncated. The only size knob that exists is the ADVISORY
# session_start_injection.memory_inject_budget_bytes at the bottom of this file.
memory:
  threat_scan_scope: "strict"      # Threat scanning strictness

# Skill Library
skills:
  # Resolved by scripts/lib/paths.py, NOT hardcoded and never ~/.claude --
  # the store is vendor-neutral. `paths.py get skills` prints the real value;
  # it is <store>/learned-skills, where <store> defaults to
  # ~/.local/share/agent-learning and honours $AGENT_LEARNING_HOME and
  # $XDG_DATA_HOME. These three lines named ~/.claude until 2026-07-31.
  root_dir: "<store>/learned-skills"
  archive_dir: "<store>/learned-skills/.archive"
  usage_file: "<store>/learned-skills/.usage.json"
  stale_after_days: 30             # Days of inactivity before marking stale
  archive_after_days: 90           # Days of inactivity before archiving
  template_vars: true              # Enable ${VAR} substitution in skills
  inline_shell: false              # Enable !`cmd` execution (security: opt-in)
  inline_shell_timeout: 10         # Seconds before inline shell times out
  inline_shell_max_output: 4000    # Max chars from inline shell output
  protected_skills:                # Skills that cannot be archived
    - plan

# Curator
curator:
  enabled: true
  interval_hours: 168              # Hours between curator runs (7 days)
  min_idle_hours: 2                # Minimum idle time before running
  consolidate: false               # Enable LLM consolidation pass (opt-in)
  prune_builtins: false            # Include builtins in curation candidates
  log_dir: "<store>/logs/curator"

# Session Search
session_search:
  enabled: true
  db_path: "<store>/sessions/search.db"

# Security
security:
  threat_scan_on_write: true       # Scan memory/skill writes

# Session-start delivery (Route B). The read-back half: learned memory is
# injected into each new session via a SessionStart hook.
session_start_injection:
  # Size (BYTES) at which MEMORY.md is REPORTED as worth consolidating.
  # Advisory only -- memory is never truncated, and exceeding this costs a named
  # line in persist-failures.log, not lost content.
  #
  # The shipped value is SL_MEMORY_INJECT_BUDGET in self-learning.conf, which is
  # the file actually sourced at runtime; this entry documents it.
  #
  # 32768, not the 2200 Hermes uses, because Hermes applies 2200 on the WRITE
  # side (refusing the write, so its file never exceeds it) while ours is a
  # read-side advisory over a file persist-proposal.py allows to reach 1 MiB.
  # A real store measured 22112 bytes: at 2200 the advisory fired every session
  # and would have buried real failures in the log doctor.sh surfaces.
  memory_inject_budget_bytes: 32768

  # Resolution order, matching every other tunable (lib/config.sh semantics):
  #   env SL_MEMORY_INJECT_BUDGET  >  self-learning.conf  >  built-in default
  # Read directly in Python by inject-agents-md.py rather than by sourcing
  # config.sh, because config.sh spawns `python3 lib/paths.py all` (~22-25ms)
  # and this runs inside a <100ms hook that already resolves paths in-process.
