name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # DELETED: an "Ensure python3 resolves (Windows)" step that copied
      # python.exe to python3.exe. actions/setup-python on Windows provides
      # only `python.exe`, exactly like the python.org/winget installers this
      # repo's README recommends -- so the runner was RIGHT and the shim made
      # Windows CI green against an alias no real Windows machine has. The
      # owner's laptop then failed install.sh preflight with "Missing required
      # dependencies: python3" that six green Windows cells could not see.
      # The scripts now resolve the interpreter through
      # scripts/lib/python-resolve.sh (which runs a candidate and requires it
      # to report Python 3, defeating the fake Microsoft-Store python3 alias
      # too); tests/test-no-python3-name.sh is the regression guard. Do not
      # reintroduce a shim here -- it would re-mask precisely this class.

      # jq is preinstalled on ubuntu-latest and windows-latest, but not
      # guaranteed on macos-latest images; install explicitly rather than
      # assume. `brew install` exits 0 (with a warning) if already present,
      # so this is safe either way.
      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      # sqlite3 (the CLI, not Python's bundled sqlite3 module) ships with
      # ubuntu-latest and macos-latest but not windows-latest. This install is
      # now a convenience, not a requirement: index-session.sh moved off the
      # sqlite3 CLI entirely (scripts/lib/session_db.py, via python3's bundled
      # module) and the only remaining caller degrades to a warning. Kept so
      # the health check's DB-inspection branch is exercised on Windows when
      # choco cooperates; the verification step below reports either way and
      # no longer fails when it does not.
      - name: Install sqlite3 (Windows, optional)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install sqlite -y --no-progress

      - name: Verify required tools are on PATH
        run: |
          set -euo pipefail
          # Python is verified through the project's OWN resolver, not through
          # `command -v python3`. That name does not exist on the Windows
          # runners (nor on a real Windows machine), which is the entire point
          # of deleting the shim above: CI must run the code the way the
          # platform actually presents Python, or it verifies a fiction.
          source scripts/lib/python-resolve.sh
          if ! sl_resolve_python; then
            echo "::error::no Python 3 resolvable (tried python3, python, py -3) — failing loudly instead of letting a downstream suite silently degrade" >&2
            exit 1
          fi
          echo "[capability probe] interpreter: ${SL_PYTHON} ($("${SL_PYTHON}" --version 2>&1))"
          # REQUIRED: absence of any of these means a suite would silently
          # degrade rather than test anything, so fail loudly and early.
          for tool in jq bash; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::required tool '$tool' is not resolvable on PATH — failing loudly instead of letting a downstream suite silently degrade" >&2
              exit 1
            fi
          done
          # OPTIONAL: the sqlite3 CLI is no longer a runtime dependency. The
          # session index and search moved to python3's bundled sqlite3 module
          # (scripts/lib/session_db.py) precisely because macOS ships a CLI
          # built without FTS5, and the only remaining CLI use --
          # self-learning-health.sh's manual DB inspection -- is `command -v`
          # guarded and degrades to a warning by design. Requiring it here
          # contradicted both that code and README's requirements table, and
          # broke both Windows cells when choco's install stopped landing on
          # PATH. Report its absence rather than failing on it, so the log
          # still says which branch of the health check was exercised.
          if command -v sqlite3 >/dev/null 2>&1; then
            echo "[capability probe] sqlite3 CLI: AVAILABLE ($(command -v sqlite3)) -- health-check DB inspection will be exercised"
          else
            echo "::notice::[capability probe] sqlite3 CLI: UNAVAILABLE -- optional; session search uses python3's bundled module. self-learning-health.sh's DB-inspection branch is not exercised on this runner."
          fi

      - name: Run tests
        # Windows gets a higher per-suite ceiling: process spawns under Git
        # Bash are both slow and highly variable on the hosted runners --
        # tests/test-coach-rules-eval.py measured 43s on one windows-latest
        # run and was killed at 120s mid-test on the next (run 30888916106),
        # same code both times. 300s still bounds a genuine hang without
        # letting runner variance fail a healthy suite.
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export RUN_ALL_SUITE_TIMEOUT=300
          fi
          bash tests/run-all.sh
